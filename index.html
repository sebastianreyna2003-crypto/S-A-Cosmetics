<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S&A Cosmetics | Tienda</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#352a2f;background:#fff}header{position:sticky;top:0;z-index:20;background:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eadde2}.logo{font-family:Georgia,serif;font-size:28px;color:#a95573;font-weight:bold}.logo small{display:block;font:11px Arial;letter-spacing:3px;color:#806b73}button{cursor:pointer;border:0}.cart{background:#a95573;color:#fff;border-radius:25px;padding:11px 18px;font-weight:bold}.hero{text-align:center;background:#f9edf2;padding:50px 20px}.hero h1{font:40px Georgia;margin:0 0 8px}.hero p{margin:0;color:#806b73}.wrap{width:min(1150px,92%);margin:auto;padding:30px 0 70px}.cats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:25px}.cat{background:#fff;border:1px solid #eadde2;border-radius:25px;padding:9px 16px}.cat.active,.cat:hover{background:#a95573;color:#fff}h2{font:27px Georgia;margin:30px 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}.card{border:1px solid #eadde2;border-radius:17px;overflow:hidden;box-shadow:0 6px 20px #00000010;background:#fff}.photo{height:220px;background:#f7f5f6;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:cover}.ph{font-size:45px;color:#cda2b1}.info{padding:15px}.info h3{margin:0 0 7px}.price{font-size:20px;font-weight:bold;color:#a95573;margin:10px 0}.row{display:flex;gap:7px}.qty{display:flex;border:1px solid #eadde2;border-radius:9px}.qty button{width:32px;background:#fff;font-size:18px}.qty input{width:38px;border:0;text-align:center}.add{flex:1;background:#a95573;color:#fff;border-radius:9px;font-weight:bold}.admin{background:#fff;border:1px solid #eadde2;border-radius:16px;padding:22px;margin-top:35px;box-shadow:0 5px 20px #0000000c}.admin h2{margin-top:0}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form input,.form select{padding:11px;border:1px solid #ddd;border-radius:9px}.full{grid-column:1/-1}.save{background:#a95573;color:#fff;padding:12px 18px;border-radius:9px;font-weight:bold}.admin-list{margin-top:20px}.admin-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.del{color:#a95573;background:#f9edf2;border-radius:8px;padding:7px 10px}.cartbox{position:fixed;right:-430px;top:0;width:min(410px,92vw);height:100vh;background:#fff;z-index:50;box-shadow:-8px 0 30px #0003;padding:22px;transition:.3s;display:flex;flex-direction:column}.cartbox.open{right:0}.carthead{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:12px}.close{background:#f5edf0;border-radius:50%;width:34px;height:34px}.items{overflow:auto;flex:1}.item{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}.total{font-size:20px;font-weight:bold;padding-top:15px;display:flex;justify-content:space-between}.wa{background:#25a35a;color:white;padding:14px;border-radius:10px;margin-top:12px;font-weight:bold}.itemleft{display:flex;flex-direction:column}.remove{background:none;color:#a95573;font-size:19px;line-height:1;padding:4px 8px}.clearcart{background:#f9edf2;color:#a95573;padding:10px;border-radius:9px;font-weight:bold;margin-top:8px;width:100%}footer{background:#30272b;color:white;text-align:center;padding:25px}.note{font-size:13px;color:#806b73;margin:8px 0 18px}@media(max-width:600px){.form{grid-template-columns:1fr}.full{grid-column:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.photo{height:165px}.info{padding:11px}.hero h1{font-size:31px}}.admin-actions{display:flex;gap:6px;flex-wrap:wrap}.edit{background:#f1e9ed;color:#8e4d68;border-radius:8px;padding:7px 10px}.stock-ok{color:#27804b;font-weight:bold}.stock-low{color:#a86a00;font-weight:bold}.stock-out{color:#b33a4b;font-weight:bold}
</style></head><body>
<header><div class="logo">S&A Cosmetics<small>MAKEUP & BEAUTY</small></div><button class="cart" onclick="openCart()">🛒 Carrito (<span id="count">0</span>)</button></header>
<section class="hero"><h1>Tu belleza, tu estilo</h1><p>Elegí tus productos y armá tu pedido.</p></section>
<main class="wrap"><div class="cats" id="cats"></div><div id="shop"></div>
<section class="admin"><h2>⚙️ Administración</h2><div id="loginBox"><p class="note">Ingresá con tu cuenta de administrador.</p><div class="form"><input id="adminEmail" type="email" placeholder="Email de administrador"><input id="adminPass" type="password" placeholder="Contraseña"><button class="save full" onclick="loginAdmin()">Ingresar</button></div></div>
<div id="adminPanel" style="display:none"><p class="note">Desde acá podés agregar, editar, eliminar productos y controlar el stock.</p><div class="form"><input id="name" placeholder="Nombre del producto"><select id="category"><option>Rostro</option><option>Ojos</option><option>Labios</option><option>Skincare</option><option>Otros</option></select><input id="price" type="number" min="0" placeholder="Precio"><input id="stock" type="number" min="0" placeholder="Cantidad / stock"><input id="image" class="full" type="file" accept="image/*"><button id="saveBtn" class="save full" onclick="saveProduct()">＋ Agregar producto</button><button class="full" style="background:#eee;padding:10px;border-radius:9px" onclick="cancelEdit()">Cancelar edición</button></div><div class="admin-list" id="adminList"></div><button onclick="logoutAdmin()" style="margin-top:15px;background:#f9edf2;color:#a95573;padding:9px 14px;border-radius:9px">Cerrar sesión</button></div></section></main>
<aside class="cartbox" id="cart"><div class="carthead"><h2 style="margin:0;font-size:23px">🛒 Carrito</h2><button class="close" onclick="closeCart()">✕</button></div><div class="items" id="items"></div><div class="total"><span>Total</span><span id="total">$0</span></div><button class="wa" onclick="whatsapp()">📲 Pedir por WhatsApp</button><button class="clearcart" onclick="clearCart()">🗑️ Vaciar carrito</button></aside><footer>S&A Cosmetics · Maquillaje y cosmética</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://ivedjfzrbpyejxnqduap.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_t14xzm9elvJKXxqAUHVGew_LAnsPsL-";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let products=[],cart=JSON.parse(localStorage.getItem("sa_cart")||"[]"),editingId=null;
const money=n=>"$"+Number(n).toLocaleString("es-AR");function persistCart(){localStorage.setItem("sa_cart",JSON.stringify(cart))}
function normalize(p){return{id:p.id,name:p.name||"",category:p.category||"Otros",price:Number(p.price)||0,stock:Number(p.stock)||0,image:p.image_url||""}}
async function loadProducts(){const{data,error}=await supabaseClient.from("products").select("*").order("created_at",{ascending:true});if(error){console.error(error);alert("No se pudieron cargar los productos desde Supabase: "+error.message);products=[]}else products=data.map(normalize);render()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function render(){const cats=["Todos",...new Set(products.map(p=>p.category))];document.getElementById("cats").innerHTML=cats.map((c,i)=>`<button class="cat ${i===0?'active':''}" onclick='filter(${JSON.stringify(c)},this)'>${escapeHtml(c)}</button>`).join("");filter("Todos",document.querySelector(".cat"));renderAdmin();renderCart()}
function filter(cat,btn){document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));if(btn)btn.classList.add("active");const list=cat==="Todos"?products:products.filter(p=>p.category===cat),groups=cat==="Todos"?[...new Set(list.map(p=>p.category))]:[cat];document.getElementById("shop").innerHTML=groups.map(g=>`<section><h2>${escapeHtml(g)}</h2><div class="grid">${list.filter(p=>p.category===g).map(card).join("")}</div></section>`).join("")}
function card(p){const sc=p.stock<=0?"stock-out":p.stock<=3?"stock-low":"stock-ok",st=p.stock<=0?"Sin stock":`Stock: ${p.stock}`;return `<article class="card"><div class="photo">${p.image?`<img src="${p.image}" alt="${escapeHtml(p.name)}">`:'<div class="ph">💄</div>'}</div><div class="info"><h3>${escapeHtml(p.name)}</h3><div class="price">${money(p.price)}</div><small class="${sc}">${st}</small><div class="row" style="margin-top:9px"><div class="qty"><button onclick="changeQty('${p.id}',-1)">−</button><input id="q${p.id}" type="number" min="1" max="${p.stock}" value="${p.stock>0?1:0}" ${p.stock<=0?'disabled':''}><button onclick="changeQty('${p.id}',1)">+</button></div><button class="add" onclick="addToCart('${p.id}')" ${p.stock<=0?'disabled style="opacity:.5"':''}>Agregar</button></div></div></article>`}
function changeQty(id,d){const p=products.find(x=>x.id===id),i=document.getElementById("q"+id);if(!p||!i||p.stock<=0)return;i.value=Math.min(p.stock,Math.max(1,(+i.value||1)+d))}
function addToCart(id){const p=products.find(x=>x.id===id);if(!p||p.stock<=0)return alert("Este producto está sin stock.");const i=document.getElementById("q"+id),q=Math.max(1,Math.min(p.stock,+i.value||1)),old=cart.find(x=>x.id===id),cur=old?old.qty:0;if(cur+q>p.stock)return alert("No hay suficiente stock.");if(old)old.qty+=q;else cart.push({id,qty:q});persistCart();renderCart();openCart()}
function renderCart(){let total=0;document.getElementById("items").innerHTML=cart.length?cart.map(x=>{const p=products.find(y=>y.id===x.id);if(!p)return"";total+=p.price*x.qty;return `<div class="item"><span class="itemleft"><b>${escapeHtml(p.name)}</b><small>${x.qty} × ${money(p.price)}</small></span><span><b>${money(p.price*x.qty)}</b> <button class="remove" onclick="removeFromCart('${p.id}')">✕</button></span></div>`}).join(""):"<p style='text-align:center;color:#8b7a81;margin-top:40px'>Tu carrito está vacío.</p>";document.getElementById("total").textContent=money(total);document.getElementById("count").textContent=cart.reduce((a,x)=>a+x.qty,0)}
function renderAdmin(){if(document.getElementById("adminPanel").style.display==="none")return;document.getElementById("adminList").innerHTML=products.map(p=>{const sc=p.stock<=0?"stock-out":p.stock<=3?"stock-low":"stock-ok";return `<div class="admin-item"><span><b>${escapeHtml(p.name)}</b> · ${escapeHtml(p.category)} · ${money(p.price)} · <span class="${sc}">stock: ${p.stock}</span></span><span class="admin-actions"><button class="edit" onclick="editProduct('${p.id}')">✏️ Editar</button><button class="del" onclick="deleteProduct('${p.id}')">🗑️ Eliminar</button></span></div>`}).join("")}
function fileToDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function saveProduct(){const name=document.getElementById("name").value.trim(),category=document.getElementById("category").value,price=Number(document.getElementById("price").value),stock=Math.max(0,Number(document.getElementById("stock").value)||0),file=document.getElementById("image").files[0];if(!name||price<0)return alert("Completá nombre y precio.");let imageUrl="";if(file){if(file.size>3*1024*1024)return alert("La imagen pesa más de 3 MB.");imageUrl=await fileToDataUrl(file)}let result;if(editingId){const payload={name,category,price,stock};if(imageUrl)payload.image_url=imageUrl;result=await supabaseClient.from("products").update(payload).eq("id",editingId)}else result=await supabaseClient.from("products").insert({name,category,price,stock,image_url:imageUrl||null});if(result.error)return alert("No se pudo guardar: "+result.error.message);cancelEdit();await loadProducts()}
async function loginAdmin(){const email=document.getElementById("adminEmail").value.trim(),password=document.getElementById("adminPass").value,{data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)return alert("No se pudo iniciar sesión: "+error.message);document.getElementById("loginBox").style.display="none";document.getElementById("adminPanel").style.display="block";renderAdmin()}
async function logoutAdmin(){await supabaseClient.auth.signOut();document.getElementById("adminPanel").style.display="none";document.getElementById("loginBox").style.display="block";document.getElementById("adminPass").value=""}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;editingId=id;name.value=p.name;category.value=p.category;price.value=p.price;stock.value=p.stock;image.value="";saveBtn.textContent="💾 Guardar cambios";adminPanel.scrollIntoView({behavior:"smooth"})}
function cancelEdit(){editingId=null;name.value="";price.value="";stock.value="";image.value="";saveBtn.textContent="＋ Agregar producto"}
async function deleteProduct(id){if(!confirm("¿Eliminar este producto?"))return;const{error}=await supabaseClient.from("products").delete().eq("id",id);if(error)return alert("No se pudo eliminar: "+error.message);cart=cart.filter(x=>x.id!==id);persistCart();await loadProducts()}
function removeFromCart(id){cart=cart.filter(x=>x.id!==id);persistCart();renderCart()}function clearCart(){if(!cart.length)return;if(confirm("¿Vaciar todo el carrito?")){cart=[];persistCart();renderCart()}}function openCart(){document.getElementById("cart").classList.add("open")}function closeCart(){document.getElementById("cart").classList.remove("open")}
function whatsapp(){if(!cart.length)return alert("El carrito está vacío.");let total=0;const lines=cart.map(x=>{const p=products.find(y=>y.id===x.id);total+=p.price*x.qty;return`• ${p.name} x${x.qty} — ${money(p.price*x.qty)}`}).join("\n"),msg=`Hola! Pedí estos productos:\n\n${lines}\n\nTotal: ${money(total)}`;window.open("https://wa.me/5493532415606?text="+encodeURIComponent(msg),"_blank")}
loadProducts();
</script></body></html>
